# Read the Docs configuration file
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  commands:
    # Install Poetry
    - pip install poetry
    # Install dependencies and the package itself
    # Only 'dev' group is needed (contains sphinx, sphinx-rtd-theme, nbsphinx)
    - poetry install --with dev
    # Build documentation using Poetry's environment
    # Output to the location Read the Docs expects
    - poetry run sphinx-build -b html docs/ ${READTHEDOCS_OUTPUT}/html

sphinx:
  configuration: docs/conf.py
  builder: html
  fail_on_warning: false
